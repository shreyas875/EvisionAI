<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerGrid EV - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d2d5f 100%); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; padding: 32px; }
        .shell { width: 100%; max-width: 720px; }
        .logo { text-align: center; font-weight: 800; color: #00d4ff; margin-bottom: 16px; font-size: 1.25rem; }
        .subtitle { text-align: center; color: rgba(255,255,255,.8); margin-bottom: 28px; font-size: 1.05rem; }
        .card { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border: 1px solid rgba(0,212,255,0.25); border-radius: 24px; padding: 32px; box-shadow: 0 20px 55px rgba(0, 212, 255, 0.14); }
        h1 { font-size: 2rem; margin-bottom: .5rem; background: linear-gradient(135deg, #00d4ff, #66e0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { margin-top: 16px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 1.05rem; }
        input, select { width: 100%; padding: 1.05rem 1.1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,0.32); background: rgba(20,20,28,0.85); color: #e9f4ff; font-size: 1.05rem; }
        select option { color: #0e1116; background: #e9f4ff; }
        input:focus, select:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 0 4px rgba(0,212,255,0.25); }
        .actions { margin-top: 22px; display: grid; gap: 12px; }
        .btn { width: 100%; padding: 1.05rem 1.1rem; border: none; border-radius: 999px; font-weight: 800; cursor: pointer; transition: transform .15s ease, box-shadow .2s ease; font-size: 1.05rem; }
        .btn-primary { background: linear-gradient(135deg, #34c759, #28a745); color: white; box-shadow: 0 12px 32px rgba(52,199,89,.38); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(52,199,89,.46); }
        .link-row { text-align: center; color: rgba(255,255,255,.85); font-size: 1.02rem; }
        .link-row a { color: #00d4ff; text-decoration: none; font-weight: 700; }
        .error { color: #ff7070; margin-top: 12px; display: none; text-align: center; font-weight: 700; font-size: 1rem; }
        .topbar { position: fixed; top: 18px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .topbar a { pointer-events: all; color: rgba(255,255,255,.95); text-decoration: none; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">⚡ PowerGrid EV</div>
        <a href="login.html">← Back to Sign in</a>
    </div>

    <div class="shell">
        <div class="card">
            <h1>Create your account</h1>
            <p class="subtitle">We’ll save your EV preferences for a faster experience</p>

            <div class="row">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Choose a username" autocomplete="username">
                </div>
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" type="text" placeholder="e.g., Alex Johnson" autocomplete="name">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="password">Create password</label>
                    <input id="password" type="password" placeholder="Create a password" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input id="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password">
                </div>
            </div>

            <div class="field">
                <label for="evBrand">EV brand</label>
                <select id="evBrand">
                    <option value="">Select brand…</option>
                    <option>Tesla</option>
                    <option>Hyundai</option>
                    <option>BYD</option>
                    <option>Tata</option>
                    <option>MG</option>
                    <option>Kia</option>
                    <option>Volkswagen</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="row">
                <div class="field">
                    <label for="chargerType">Charger type</label>
                    <select id="chargerType">
                        <option value="">Select type…</option>
                        <option>CCS2</option>
                        <option>CHAdeMO</option>
                        <option>Type 2 (AC)</option>
                        <option>Tesla</option>
                        <option>GB/T</option>
                        <option>Type 1 (J1772)</option>
                    </select>
                </div>
                <div class="field">
                    <label for="homeLocation">Home location (city/area)</label>
                    <input id="homeLocation" type="text" placeholder="e.g., Pune, Maharashtra" autocomplete="address-level2">
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="registerBtn">Create account</button>
                <div class="error" id="errorMsg">Please fill all fields correctly</div>
                <div class="link-row">Already have an account? <a href="login.html">Sign in</a></div>
            </div>
        </div>
    </div>

    <script>
        const USERS_KEY = 'pg_users_v1';
        const PROFILE_KEY = 'pg_user_profile_v1';

        function loadUsers() {
            try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch { return {}; }
        }
        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }
        function saveProfile(profile) {
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        }
        function redirectToDashboard(name) {
            const q = name ? `?name=${encodeURIComponent(name)}&auth=1` : `?auth=1`;
            window.location.href = `guest-dashboard.html${q}`;
        }

        document.getElementById('registerBtn').addEventListener('click', () => {
            const username = (document.getElementById('username').value || '').trim();
            const name = (document.getElementById('name').value || '').trim();
            const password = document.getElementById('password').value || '';
            const confirm = document.getElementById('confirm').value || '';
            const evBrand = document.getElementById('evBrand').value;
            const chargerType = document.getElementById('chargerType').value;
            const homeLocation = (document.getElementById('homeLocation').value || '').trim();

            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';

            if (!username || !name || !password || !confirm || !evBrand || !chargerType || !homeLocation) {
                errorEl.textContent = 'Please fill all fields';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.style.display = 'block';
                return;
            }
            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            const users = loadUsers();
            if (users[username]) {
                errorEl.textContent = 'Username already exists';
                errorEl.style.display = 'block';
                return;
            }

            users[username] = { username, name, password, evBrand, chargerType, homeLocation, createdAt: Date.now() };
            saveUsers(users);
            saveProfile({ username, name, evBrand, chargerType, homeLocation, createdAt: Date.now() });
            redirectToDashboard(name);
        });
    </script>
</body>
</html>
